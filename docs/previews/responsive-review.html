<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRISM — responsive review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#334038;color:#edf5ef;font:12px system-ui}header{min-height:48px;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;cursor:pointer;padding:5px 9px;background:#ecf2eb;color:#15271d;border:0;border-radius:3px}main{display:flex;justify-content:center;min-width:min-content}iframe{border:0;display:block;width:390px;height:844px;flex-shrink:0;background:#0b1013}output{font:11px monospace;margin-left:auto}
</style>
<header><strong>PRISM · review</strong><button data-width="390">390 × 844</button><button data-width="1440">1440 × 900</button><button data-go="opening,0">Opening</button><button data-go="clinical,0">LVEF</button><button data-go="shared,0">Shared</button><button data-go="lead-stage,0.08">12 leads</button><button data-go="lead-stage,0.42">Transition</button><button data-go="lead-stage,0.74">II only</button><button data-go="single-result,0">Result</button><output id="status" aria-live="polite">390 × 844</output></header>
<main><iframe id="preview" title="PRISM research exhibit" src="../../index.html"></iframe></main>
<script>
// Review-only controls. The production page remains a self-contained index.html.
const frame=document.getElementById('preview'),status=document.getElementById('status');
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{const width=Number(button.dataset.width);frame.style.width=width+'px';frame.style.height=(width===390?844:900)+'px';status.textContent=width===390?'390 × 844':'1440 × 900'});
document.querySelectorAll('[data-go]').forEach(button=>button.onclick=()=>{const [id,p]=button.dataset.go.split(',');const el=frame.contentDocument.getElementById(id),stage=el.querySelector('.stage'),range=stage?el.offsetHeight-stage.offsetHeight:0;frame.contentWindow.scrollTo(0,Math.round(el.offsetTop+range*Number(p)));status.textContent=id+' / '+p});
</script>
</html>
